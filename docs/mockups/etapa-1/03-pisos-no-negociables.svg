<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Lato, system-ui, sans-serif">
  <rect width="1280" height="720" fill="#EFEDEA"/>

  <!-- Header berry -->
  <rect x="0" y="0" width="1280" height="64" fill="#970E48"/>
  <rect x="0" y="64" width="1280" height="4" fill="#C2995C"/>
  <text x="48" y="40" fill="#ffffff" font-size="18" font-weight="900" letter-spacing="0.5">SED 2.0  ·  ETAPA 1</text>
  <text x="1232" y="40" text-anchor="end" fill="#f4cad8" font-size="12" font-weight="300" letter-spacing="2">PLAN RENACIMIENTO MAYA  ·  YUCATÁN 2024–2030</text>

  <!-- Título -->
  <g transform="translate(48 110)">
    <text x="0" y="0" fill="#970E48" font-size="13" font-weight="900" letter-spacing="3">TRES PISOS MÍNIMOS NO-NEGOCIABLES</text>
    <rect x="0" y="8" width="60" height="3" fill="#C2995C"/>
    <text x="0" y="50" fill="#1a1410" font-size="34" font-weight="900">Cumplimiento legal y técnico inamovible</text>
    <text x="0" y="78" fill="#5e554b" font-size="14" font-weight="300">Estos tres pisos son condición de aceptación de la Etapa 1. Sin ellos, la plataforma no puede entrar en operación.</text>
  </g>

  <!-- 3 columnas (pisos) -->
  <g transform="translate(48 220)">
    <!-- ============= PISO 1: LGPDPPSO ============= -->
    <g transform="translate(0 0)">
      <rect width="384" height="430" rx="10" fill="#ffffff" stroke="#cdc7bb"/>
      <!-- Banda berry superior estilo capítulo -->
      <rect x="0" y="0" width="384" height="68" fill="#970E48"/>
      <rect x="0" y="68" width="384" height="3" fill="#C2995C"/>
      <text x="20" y="32" fill="#f4cad8" font-size="11" font-weight="900" letter-spacing="3">PISO 1</text>
      <text x="20" y="56" fill="#ffffff" font-size="22" font-weight="900">LGPDPPSO básica</text>

      <text x="20" y="100" fill="#5e554b" font-size="12" font-weight="300">Protección de datos personales en posesión</text>
      <text x="20" y="116" fill="#5e554b" font-size="12" font-weight="300">de sujetos obligados — cumplimiento mínimo.</text>

      <!-- Bullets -->
      <g font-size="12" fill="#1a1410">
        <g transform="translate(20 150)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">AIPDP firmado</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Aviso integral de privacidad protocolizado</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">por la unidad de transparencia.</text>
        </g>

        <g transform="translate(20 210)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Aviso bilingüe es / yua</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Español y maya yucateco, lenguaje claro,</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">accesible al titular y al tutor.</text>
        </g>

        <g transform="translate(20 270)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">ARCO operativos en 20 días hábiles</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Acceso, Rectificación, Cancelación, Oposición</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">— flujo digital, audit log y plazo legal.</text>
        </g>

        <g transform="translate(20 330)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Cifrado AES-256 / TLS 1.3</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">En reposo y en tránsito. Cifrado a nivel campo</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">para BAP y socioemocional.</text>
        </g>

        <g transform="translate(20 390)">
          <rect width="3" height="32" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Audit log retención 7 años</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Inmutable, hash-encadenado.</text>
        </g>
      </g>
    </g>

    <!-- ============= PISO 2: ACCESIBILIDAD ============= -->
    <g transform="translate(400 0)">
      <rect width="384" height="430" rx="10" fill="#ffffff" stroke="#cdc7bb"/>
      <rect x="0" y="0" width="384" height="68" fill="#970E48"/>
      <rect x="0" y="68" width="384" height="3" fill="#C2995C"/>
      <text x="20" y="32" fill="#f4cad8" font-size="11" font-weight="900" letter-spacing="3">PISO 2</text>
      <text x="20" y="56" fill="#ffffff" font-size="22" font-weight="900">Accesibilidad mínima</text>

      <text x="20" y="100" fill="#5e554b" font-size="12" font-weight="300">WCAG 2.1 AA en interfaces críticas, verificada</text>
      <text x="20" y="116" fill="#5e554b" font-size="12" font-weight="300">por auditoría externa antes del despliegue.</text>

      <g font-size="12" fill="#1a1410">
        <g transform="translate(20 150)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">WCAG 2.1 AA verificado</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Auditoría externa con organismo certificador</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">previo al despliegue estatal.</text>
        </g>

        <g transform="translate(20 210)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Lectores de pantalla</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Compatibilidad NVDA, JAWS y VoiceOver;</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">etiquetas semánticas y ARIA.</text>
        </g>

        <g transform="translate(20 270)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Navegación por teclado</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Foco visible, skip-link, secuencia tabular</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">predecible y atajos para aplicador.</text>
        </g>

        <g transform="translate(20 330)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Contraste y modo claro</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Ratio ≥ 4.5:1, modo alto contraste opcional</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">y soporte prefers-reduced-motion.</text>
        </g>

        <g transform="translate(20 390)">
          <rect width="3" height="32" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Tiempo extendido como acomodación</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Acomodación básica reconocida por sistema.</text>
        </g>
      </g>
    </g>

    <!-- ============= PISO 3: CURP ============= -->
    <g transform="translate(800 0)">
      <rect width="384" height="430" rx="10" fill="#ffffff" stroke="#cdc7bb"/>
      <rect x="0" y="0" width="384" height="68" fill="#970E48"/>
      <rect x="0" y="68" width="384" height="3" fill="#C2995C"/>
      <text x="20" y="32" fill="#f4cad8" font-size="11" font-weight="900" letter-spacing="3">PISO 3</text>
      <text x="20" y="56" fill="#ffffff" font-size="22" font-weight="900">Identidad federada CURP</text>

      <text x="20" y="100" fill="#5e554b" font-size="12" font-weight="300">CURP como identificador único persistente</text>
      <text x="20" y="116" fill="#5e554b" font-size="12" font-weight="300">para análisis longitudinal multi-año.</text>

      <g font-size="12" fill="#1a1410">
        <g transform="translate(20 150)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Validación con dígito SEGOB</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Algoritmo oficial RENAPO; rechazo de CURP</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">inválida en captura.</text>
        </g>

        <g transform="translate(20 210)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Cruce con Estadística 911</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Conciliación de matrícula con el formato 911</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">de inicio de ciclo SEP.</text>
        </g>

        <g transform="translate(20 270)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Persistencia ante movilidad</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">El estudiante mantiene su histórico aunque</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">cambie de escuela, zona o región.</text>
        </g>

        <g transform="translate(20 330)">
          <rect width="3" height="48" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Estructura longitudinal</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">Datos diseñados desde el modelo para</text>
          <text x="14" y="46" font-size="11" fill="#5e554b" font-weight="300">análisis trayectoria multi-año.</text>
        </g>

        <g transform="translate(20 390)">
          <rect width="3" height="32" fill="#C2995C"/>
          <text x="14" y="14" font-weight="700">Identidad única estatal</text>
          <text x="14" y="32" font-size="11" fill="#5e554b" font-weight="300">CURP estudiante · RFC personal (P-03).</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <rect x="0" y="690" width="1280" height="30" fill="#640730"/>
  <text x="48" y="710" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">TRES PISOS NO-NEGOCIABLES · Auditoría externa antes de operar</text>
  <text x="1232" y="710" text-anchor="end" fill="#f4cad8" font-size="11">03 / 06</text>
</svg>
