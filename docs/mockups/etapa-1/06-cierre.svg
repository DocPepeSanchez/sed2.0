<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Lato, system-ui, sans-serif">
  <!-- Fondo crema -->
  <rect width="1280" height="720" fill="#EFEDEA"/>

  <!-- Banda berry vertical derecha (espejo de la portada) -->
  <rect x="900" y="0" width="380" height="720" fill="#970E48"/>
  <rect x="894" y="0" width="6" height="720" fill="#C2995C"/>

  <!-- Acento decorativo -->
  <g opacity="0.18" transform="translate(960 80)">
    <circle cx="0" cy="0" r="4" fill="#C2995C"/>
    <circle cx="20" cy="0" r="4" fill="#C2995C"/>
    <circle cx="40" cy="0" r="4" fill="#C2995C"/>
    <line x1="0" y1="20" x2="280" y2="20" stroke="#C2995C" stroke-width="1"/>
  </g>

  <!-- ============= ÁREA IZQUIERDA ============= -->
  <g transform="translate(80 110)">
    <text x="0" y="0" fill="#970E48" font-size="13" font-weight="900" letter-spacing="3">CRITERIO DE CIERRE · ETAPA 1</text>
    <rect x="0" y="8" width="60" height="3" fill="#C2995C"/>

    <text x="0" y="60" fill="#1a1410" font-size="40" font-weight="900">Cuándo está</text>
    <text x="0" y="104" fill="#1a1410" font-size="40" font-weight="900">terminada</text>
    <text x="0" y="148" fill="#1a1410" font-size="40" font-weight="900">la Etapa 1</text>

    <!-- Checks de cierre -->
    <g transform="translate(0 200)">
      <g transform="translate(0 0)">
        <circle cx="14" cy="14" r="14" fill="#970E48"/>
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="20" fill="#1a1410" font-size="15" font-weight="700">Los 8 pilares de la propuesta original operan en producción</text>
      </g>
      <g transform="translate(0 50)">
        <circle cx="14" cy="14" r="14" fill="#970E48"/>
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="20" fill="#1a1410" font-size="15" font-weight="700">Piso 1 — INAIP firma cumplimiento LGPDPPSO</text>
      </g>
      <g transform="translate(0 100)">
        <circle cx="14" cy="14" r="14" fill="#970E48"/>
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="20" fill="#1a1410" font-size="15" font-weight="700">Piso 2 — auditoría externa certifica WCAG 2.1 AA</text>
      </g>
      <g transform="translate(0 150)">
        <circle cx="14" cy="14" r="14" fill="#970E48"/>
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="20" fill="#1a1410" font-size="15" font-weight="700">Piso 3 — RENAPO/SEP valida identidad federada CURP</text>
      </g>
      <g transform="translate(0 200)">
        <circle cx="14" cy="14" r="14" fill="#970E48"/>
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="20" fill="#1a1410" font-size="15" font-weight="700">Pilotaje con muestra ≥ 500 respuestas concluido</text>
      </g>
      <g transform="translate(0 250)">
        <circle cx="14" cy="14" r="14" fill="#970E48"/>
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="20" fill="#1a1410" font-size="15" font-weight="700">Disponibilidad ≥ 99.5 % bajo carga simulada estatal</text>
      </g>
    </g>
  </g>

  <!-- ============= ÁREA DERECHA (banda berry) ============= -->
  <g transform="translate(940 130)">
    <text x="0" y="0" fill="#C2995C" font-size="11" font-weight="900" letter-spacing="3">SIGUIENTE</text>
    <rect x="0" y="8" width="40" height="2" fill="#C2995C"/>

    <text x="0" y="50" fill="#ffffff" font-size="22" font-weight="900">Etapa 2</text>
    <text x="0" y="78" fill="#f4cad8" font-size="13" font-weight="300">Calibración psicométrica</text>
    <text x="0" y="96" fill="#f4cad8" font-size="13" font-weight="300">avanzada y observatorio</text>
    <text x="0" y="114" fill="#f4cad8" font-size="13" font-weight="300">de datos abiertos.</text>

    <rect x="0" y="140" width="280" height="1" fill="#C2995C" opacity="0.4"/>

    <text x="0" y="180" fill="#C2995C" font-size="11" font-weight="900" letter-spacing="3">CONTACTO INSTITUCIONAL</text>
    <text x="0" y="220" fill="#ffffff" font-size="14" font-weight="700">CEEEY</text>
    <text x="0" y="240" fill="#f4cad8" font-size="11" font-weight="300">Centro de Evaluación Educativa</text>
    <text x="0" y="256" fill="#f4cad8" font-size="11" font-weight="300">del Estado de Yucatán</text>
    <text x="0" y="284" fill="#f4cad8" font-size="11" font-weight="300">Mérida, Yucatán · México</text>
  </g>

  <!-- Logo grande en banda -->
  <g transform="translate(940 480)">
    <text x="0" y="0" fill="#ffffff" font-size="60" font-weight="900" letter-spacing="-1">SED 2.0</text>
    <rect x="0" y="14" width="80" height="3" fill="#C2995C"/>
    <text x="0" y="58" fill="#f4cad8" font-size="11" font-weight="300">Sistema de Evaluación Dinámica</text>
  </g>

  <!-- Pie izquierdo decorativo -->
  <g transform="translate(80 600)">
    <rect width="60" height="3" fill="#C2995C"/>
    <text x="0" y="30" fill="#5e554b" font-size="11" font-weight="700" letter-spacing="2">PLAN RENACIMIENTO MAYA</text>
    <text x="0" y="48" fill="#5e554b" font-size="11" font-weight="300" letter-spacing="2">YUCATÁN  ·  2024 — 2030</text>
  </g>

  <!-- Footer institucional -->
  <rect x="0" y="690" width="1280" height="30" fill="#640730"/>
  <text x="48" y="710" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">CIERRE · Plan Renacimiento Maya · Yucatán 2024–2030</text>
  <text x="1232" y="710" text-anchor="end" fill="#f4cad8" font-size="11">06 / 06</text>
</svg>
