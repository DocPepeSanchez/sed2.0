# SED 2.0 — stack local completo para demo y desarrollo.
#
#   docker compose up -d        # arranca Postgres + app
#   docker compose run --rm migrate
#   docker compose run --rm seed
#   docker compose logs -f app  # http://localhost:3000/es
#
# Para producción real véase docs/deployment.md (datacenter MX, HSM, K8s).

services:
  db:
    image: postgres:16-alpine
    container_name: sed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: sed_dev_password
      POSTGRES_DB: sed
    ports:
      - "5432:5432"
    volumes:
      - sed-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed -d sed"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sed-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sed:sed_dev_password@db:5432/sed
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_minimum_32_characters_xxx}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-dev_field_key_minimum_32_bytes_base64_xx=}
      DEFAULT_LOCALE: es
      SUPPORTED_LOCALES: es,yua
      LOG_LEVEL: info
      NODE_ENV: production
    ports:
      - "3000:3000"

  # Aplica el esquema Drizzle a la BD (`docker compose run --rm migrate`).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sed:sed_dev_password@db:5432/sed
    command: ["npm", "run", "db:push"]

  # Carga catálogos oficiales y datos demo.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sed:sed_dev_password@db:5432/sed
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-dev_field_key_minimum_32_bytes_base64_xx=}
    command: ["npm", "run", "db:seed"]

volumes:
  sed-db-data:
