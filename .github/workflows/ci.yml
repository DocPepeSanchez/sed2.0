name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Pruebas unitarias (Vitest)
        run: npm test
        continue-on-error: true
        env:
          # Las pruebas no tocan la BD; estos valores son placeholders.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SESSION_SECRET: test-secret-test-secret-test-secret-xx
          FIELD_ENCRYPTION_KEY: test-key-test-key-test-key-test-key-xxx
