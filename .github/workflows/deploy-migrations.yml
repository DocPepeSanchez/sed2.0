# Aplica migraciones Drizzle contra la BD de producción/preview cuando se
# empuja a una rama protegida. Se ejecuta antes de que Vercel termine su
# despliegue gracias al `wait-for` opcional.
#
# Requiere los siguientes secrets en GitHub:
#   - DATABASE_URL_PROD     → cadena de conexión Postgres producción
#   - DATABASE_URL_PREVIEW  → (opcional) cadena para previews

name: Migrar BD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: '¿Correr seed después de migrar?'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Aplicar migraciones
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Cargar seed (catálogos)
        if: ${{ inputs.seed == true }}
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
