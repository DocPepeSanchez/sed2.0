# SED 2.0 — Render.com Infrastructure-as-Code blueprint.
#
# Uso: en https://render.com → "New +" → "Blueprint" → conecta este repo.
# Render lee este YAML, crea la BD Postgres y el web service automáticamente.
# Genera SESSION_SECRET y FIELD_ENCRYPTION_KEY automáticamente (generateValue).

databases:
  - name: sed-postgres
    databaseName: sed
    user: sed
    plan: free  # 256 MB, 1 GB storage; suficiente para demo
    region: oregon

services:
  - type: web
    name: sed-app
    runtime: node
    plan: free
    region: oregon
    branch: claude/build-sed-2-platform-d45P8
    # db:migrate y db:seed son idempotentes (onConflictDoNothing), seguros
    # de correr en cada build. Evitamos preDeployCommand para mantenerlo
    # disponible en plan free.
            buildCommand: npm install --legacy-peer-deps && npm run db:migrate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sed-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_LOCALE
        value: es
      - key: SUPPORTED_LOCALES
        value: es,yua
      - key: LOG_LEVEL
        value: info
      - key: NODE_VERSION
        value: "20.10.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
